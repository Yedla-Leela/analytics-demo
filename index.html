<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN"
  "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Leela's Github page</title>

  <script type="text/javascript">
    // Generate random Order ID
    window.generateOrderId = function() {
      return "ORD-" + Math.floor(Math.random() * 1000000);
    };

    // Generate random User ID in format U12345
    window.generateUserId = function() {
      return "U" + Math.floor(10000 + Math.random() * 90000);
    };

    window.digitalData = {
      page: {
        pageName: document.title || "HomePage",
        pageURL: window.location.href,
        pagePath: window.location.pathname,
        siteSection: "Landing",
        pageType: "Demo",
        language: "en",
        siteSubSection: "",
        server: window.location.hostname
      },

      user: {
        userId: window.generateUserId(),
        userType: "Registered"
      },

      marketing: {
        channel: "Organic Search"
      },

      customer: {
        loginStatus: "LoggedIn"
      },

      orderDetails: {
        type: "PrePaid",
        id: window.generateOrderId()
      },

      event: {
        timestamp: new Date().toISOString()
      }
    };
  </script>

  <!-- Adobe Launch -->
  <script type="text/javascript"
    src="https://assets.adobedtm.com/e72b4113c11a/8a1f7e93d46e/launch-d8606b016113-development.min.js">
  </script>
</head>

<body>
  <h2>Adobe Analytics Demo Page</h2>
  <p>
    This page has Adobe Analytics implemented via AEP WebSDK
    for ACN LCT Training
  </p>

  <input type="button" id="demo-click-btn" value="Click Me" />

  <!-- Internal Link for Non Page View Call -->
  <p style="margin-top:20px;">
    <a href="#internal-section" id="internal-link">
      Go to Internal Section
    </a>
  </p>

  <!-- Dummy content to allow scroll -->
  <div style="height:800px;"></div>

  <div id="internal-section">
    <h3>Internal Section</h3>
    <p>You reached here by clicking the internal link.</p>
  </div>

  <!-- Non Page View Event Tracking -->
  <script type="text/javascript">
    document.getElementById("internal-link").addEventListener("click", function () {

      if (window.alloy) {
        window.alloy("sendEvent", {
          xdm: {
            eventType: "web.webinteraction.linkClicks",
            web: {
              webInteraction: {
                name: "Internal Link Click",
                type: "other",
                URL: window.location.href + "#internal-section",
                linkClicks: {
                  value: 1
                }
              }
            }
          }
        });
      }

    
    });
  </script>

</body>
</html>
